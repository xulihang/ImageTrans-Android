plugins {
    id 'com.android.application'
}

android {
    namespace 'com.basiccat.imagetrans'
    compileSdk 34

    defaultConfig {
        applicationId "com.basiccat.imagetrans"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            // The bundled AARs only contain arm64-v8a native libraries.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            pickFirst 'lib/arm64-v8a/libc++_shared.so'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation(name: 'rapidocr4j-android-1.0.0', ext: 'aar')
    implementation(name: 'opencv-4.9.0', ext: 'aar')
    implementation(name: 'onnxruntime-android-1.18.0', ext: 'aar')
}
