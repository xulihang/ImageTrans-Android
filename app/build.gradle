plugins {
    id 'com.android.application'
}

android {
    namespace 'com.basiccat.imagetrans'
    compileSdk 36

    defaultConfig {
        applicationId "com.basiccat.imagetrans"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "0.3.0"

        ndk {
            // The bundled AARs only contain arm64-v8a native libraries.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        // Only BuildConfig.VERSION_NAME is needed (shown on the home screen).
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            pickFirst 'lib/arm64-v8a/libc++_shared.so'
        }
        resources {
            // AARs arrive down a different path than the sibling app/libs
            // files, so they get a different cache key. Their assets are the
            // PP-OCRv4 models this app no longer uses (assets/ocr has the
            // current ones); keeping the app's copy on conflicts also prevents
            // a model removed from app/libs from lingering in the APK.
            pickFirsts += ['assets/**']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // RapidOcr4j's sources are bundled in this module (io.github.hzkitty and
    // de.lighti.clipper), so its arm64 OpenCV/ONNX Runtime native code is
    // shared with the app and minSdk is not limited by the published AAR (29).
    implementation(name: 'opencv-4.14.0', ext: 'aar')
    implementation(name: 'onnxruntime-android-1.31.0', ext: 'aar')

    // CameraX 1.4.2+ ships 16 KB page aligned JNI libraries (needed for
    // Android 15+ devices); 1.6.x also requires compileSdk 36 + AGP 8.9.1.
    implementation "androidx.camera:camera-camera2:1.6.2"
    implementation "androidx.camera:camera-lifecycle:1.6.2"
    implementation "androidx.camera:camera-view:1.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime:2.6.2"
    implementation "androidx.documentfile:documentfile:1.0.1"
}
