<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ImageTrans 渲染测试</title>
<style>
  body { margin: 0; padding: 16px; font: 14px sans-serif; background: #f4f4f4; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
  figure { margin: 0; background: #fff; padding: 6px; border: 1px solid #ccc; }
  figcaption { font-size: 12px; color: #555; margin-top: 4px; }
  canvas, img { display: block; }
  button { padding: 6px 14px; margin-right: 8px; margin-bottom: 8px; }
  #status { color: #555; }
</style>
</head>
<body>
<h1>渲染测试：白底（canvas）在下，文字（html-to-image）在上</h1>

<!-- CSS presets: pick one, then press a render button. -->
<div class="row">
  <label>文字框 CSS：
    <select id="cssPreset">
      <option value="border-radius: 50%;" selected>border-radius: 50%</option>
      <option value="border-radius: 20%;">border-radius: 20%</option>
      <option value="border-radius: 12px;">border-radius: 12px</option>
      <option value="border-radius: 0;">border-radius: 0（直角）</option>
      <option value="font-size: 18px; font-weight: bold; -webkit-text-stroke: 1px #000;">粗体描边</option>
      <option value="writing-mode: vertical-rl; text-align: start;">竖排（writing-mode）</option>
    </select>
  </label>
  <label>对齐：
    <select id="align">
      <option value="text-align: center;">居中</option>
      <option value="text-align: left;">左对齐</option>
      <option value="text-align: right;">右对齐</option>
    </select>
  </label>
  <label>白底：
    <select id="repair">
      <option value="white">白色</option>
      <option value="background">取框周围的底图颜色</option>
      <option value="none">不画白底</option>
    </select>
  </label>
  <button id="renderShapes">渲染形状＋重叠页</button>
</div>

<div class="row">
  <figure>
    <canvas id="src" width="480" height="260"></canvas>
    <figcaption>形状页原图：方形、竖长、横宽三个旧字块</figcaption>
  </figure>
  <figure>
    <canvas id="shapeOut" width="480" height="260"></canvas>
    <figcaption>形状页结果：白底按上面的圆角画（50% 时方形→圆，竖长→竖椭圆）</figcaption>
  </figure>
</div>

<div class="row">
  <figure>
    <canvas id="src2" width="520" height="640"></canvas>
    <figcaption>重叠页原图：框之间有重叠，背景里有旧字</figcaption>
  </figure>
  <figure>
    <canvas id="pageOut" width="520" height="640"></canvas>
    <figcaption>重叠页结果：白底在下、文字在上</figcaption>
  </figure>
</div>
<span id="status"></span>

<script src="html-to-image.js"></script>
<script>
// Keep the layers on the page (the inspector shows them) instead of removing
// them once drawn.
window.__keepLayers = true;
</script>
<script src="render.js"></script>
<script>
function readSettings() {
  return {
    css: document.getElementById('cssPreset').value + ';' + document.getElementById('align').value + ';',
    repair: document.getElementById('repair').value
  };
}

function fillShapeSource() {
  var c = document.getElementById('src');
  var k = c.getContext('2d');
  k.fillStyle = '#333';
  k.fillRect(0, 0, c.width, c.height);
  k.fillStyle = '#aaa';
  k.font = '16px sans-serif';
  k.fillText('OLD OLD OLD', 30, 40);
  k.fillText('OLD', 180, 100);
  k.fillText('OLD OLD', 280, 60);
}

function fillPageSource() {
  var c = document.getElementById('src2');
  var g = c.getContext('2d');
  g.fillStyle = '#e8e2d4';
  g.fillRect(0, 0, c.width, c.height);
  g.font = '20px sans-serif';
  g.fillStyle = '#9a9a9a';
  ['ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE'].forEach(function (w, i) {
    g.fillText('OLD TEXT ' + w, (i % 2) * 270 + 30, 60 + Math.floor(i / 2) * 50);
  });
  g.fillStyle = '#c9a227';
  g.fillRect(250, 300, 240, 160);
  g.fillStyle = '#2b6cb0';
  g.fillRect(40, 300, 180, 90);
}

var shapeBoxes = [
  {geometry: {X: 20, Y: 20, width: 120, height: 120}, target: '方形框'},
  {geometry: {X: 170, Y: 20, width: 80, height: 200}, target: '竖长框'},
  {geometry: {X: 270, Y: 20, width: 190, height: 90}, target: '横宽框'}
];

var pageBoxes = [
  {geometry: {X: 20, Y: 20, width: 230, height: 60}, target: '第一句比较长的译文会折成好几行'},
  {geometry: {X: 20, Y: 55, width: 230, height: 60}, target: '第二句与第一个框重叠'},
  {geometry: {X: 290, Y: 20, width: 210, height: 90}, target: '右侧的框，白底会盖住旧字'},
  {geometry: {X: 20, Y: 110, width: 230, height: 70}, target: '不重叠的普通框'},
  {geometry: {X: 260, Y: 310, width: 220, height: 70}, target: '黄色背景上的框'},
  {geometry: {X: 50, Y: 310, width: 160, height: 70}, target: '蓝色背景上的框'},
  {geometry: {X: 20, Y: 400, width: 220, height: 150}, target: '一个很高的框，字号会放大'},
  {geometry: {X: 270, Y: 400, width: 220, height: 60}, target: '縦書きのテキスト'},
  {geometry: {X: 270, Y: 470, width: 220, height: 60}, target: '收尾'},
  {geometry: {X: 300, Y: 560, width: 215, height: 40}, target: '贴着图片右边缘的框，文字不能在小框里被裁掉'},
  {geometry: {X: 20, Y: 600, width: 150, height: 35}, target: '贴着下边缘的框，字号超出框'}
];

// Send a render request, draw the returned image into the canvas it belongs to.
function renderInto(sourceCanvas, targetCanvas, boxes, settings, done) {
  window.__onResult = function (dataUrl) {
    var img = new Image();
    img.onload = function () {
      var k = targetCanvas.getContext('2d');
      k.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
      k.drawImage(img, 0, 0);
      if (done) done();
    };
    img.src = dataUrl;
  };
  window.renderTranslation({
    image: sourceCanvas.toDataURL('image/png'),
    boxes: boxes,
    options: {
      renderMode: 'dom',
      textRepairMode: settings.repair,
      minFontSize: 14,
      fontScale: 1,
      renderTextCSS: settings.css
    }
  });
}

window.AndroidRenderer = {
  onRenderResult: function (dataUrl) {
    if (window.__onResult) window.__onResult(dataUrl);
    document.getElementById('status').textContent = '完成';
  },
  onRenderError: function (message) {
    document.getElementById('status').textContent = '出错：' + message;
  }
};

document.getElementById('renderShapes').onclick = function () {
  var s = readSettings();
  document.getElementById('status').textContent = '渲染中…';
  renderInto(document.getElementById('src'), document.getElementById('shapeOut'), shapeBoxes, s, function () {
    renderInto(document.getElementById('src2'), document.getElementById('pageOut'), pageBoxes, s);
  });
};

fillShapeSource();
fillPageSource();
document.getElementById('renderShapes').click();
</script>
</body>
</html>
