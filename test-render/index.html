<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ImageTrans 渲染测试</title>
<style>
  body { margin: 0; padding: 16px; font: 14px sans-serif; background: #f4f4f4; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
  figure { margin: 0; background: #fff; padding: 6px; border: 1px solid #ccc; }
  figcaption { font-size: 12px; color: #555; margin-top: 4px; }
  canvas, img { display: block; }
  button { padding: 6px 14px; margin-right: 8px; margin-bottom: 8px; }
  #status { color: #555; }
</style>
</head>
<body>
<h1>渲染测试：白底（canvas）在下，文字（html-to-image）在上</h1>
<div class="row">
  <figure><canvas id="src" width="520" height="640"></canvas><figcaption>原图（模拟漫画页里的旧字）</figcaption></figure>
  <figure><img id="out" alt="渲染结果"><figcaption>渲染结果</figcaption></figure>
</div>
<div>
  <button id="horizontal">横排</button>
  <button id="vertical">竖排</button>
  <button id="outline">描边字</button>
  <button id="none">不画白底</button>
  <button id="background">取背景色作白底</button>
  <span id="status"></span>
</div>

<script src="html-to-image.js"></script>
<script src="render.js"></script>
<script>
// A page with old text behind the boxes; some boxes overlap on purpose.
var src = document.getElementById('src');
var g = src.getContext('2d');
g.fillStyle = '#e8e2d4';
g.fillRect(0, 0, 520, 640);
g.font = '20px sans-serif';
g.fillStyle = '#9a9a9a';
['ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE'].forEach(function (w, i) {
  g.fillText('OLD TEXT ' + w, (i % 2) * 270 + 30, 60 + Math.floor(i / 2) * 50);
});
g.fillStyle = '#c9a227';
g.fillRect(250, 300, 240, 160);
g.fillStyle = '#2b6cb0';
g.fillRect(40, 300, 180, 90);

var boxes = [
  {geometry: {X: 20, Y: 20, width: 230, height: 60}, source: 'a', target: '第一句比较长的译文会折成好几行'},
  {geometry: {X: 20, Y: 55, width: 230, height: 60}, source: 'b', target: '第二句与第一个框重叠'},
  {geometry: {X: 290, Y: 20, width: 210, height: 90}, source: 'c', target: '右侧的框，白底会盖住旧字'},
  {geometry: {X: 20, Y: 110, width: 230, height: 70}, source: 'd', target: '不重叠的普通框'},
  {geometry: {X: 260, Y: 310, width: 220, height: 70}, source: 'e', target: '黄色背景上的框'},
  {geometry: {X: 50, Y: 310, width: 160, height: 70}, source: 'f', target: '蓝色背景上的框'},
  {geometry: {X: 20, Y: 400, width: 220, height: 150}, source: 'g', target: '一个很高的框，字号会放大'},
  {geometry: {X: 270, Y: 400, width: 220, height: 60}, source: 'h', target: '縦書きのテキスト'},
  {geometry: {X: 270, Y: 470, width: 220, height: 60}, source: 'i', target: '收尾'}
];

var baseCss = 'text-align: center;border-radius: 10%;';

function run(extraCss, repair) {
  var options = {
    renderMode: 'dom',
    textRepairMode: repair || 'white',
    minFontSize: 14,
    fontScale: 1,
    renderTextCSS: baseCss + (extraCss || '')
  };
  document.getElementById('status').textContent = '渲染中…';
  window.renderTranslation({
    image: src.toDataURL('image/png'),
    boxes: JSON.parse(JSON.stringify(boxes)),
    options: options
  });
}
// The app's WebView side: the result comes back as a data URL.
window.AndroidRenderer = {
  onRenderResult: function (d) {
    var img = document.getElementById('out');
    img.onload = function () { document.getElementById('status').textContent = '完成'; };
    img.src = d;
  },
  onRenderError: function (m) {
    document.getElementById('status').textContent = '出错：' + m;
  }
};
document.getElementById('horizontal').onclick = function () { run(); };
document.getElementById('vertical').onclick = function () {
  run('writing-mode: vertical-rl;text-align: start;');
};
document.getElementById('outline').onclick = function () {
  run('font-size: 18px;font-weight: bold;-webkit-text-stroke: 1px #000;');
};
document.getElementById('none').onclick = function () { run('', 'none'); };
document.getElementById('background').onclick = function () { run('', 'background'); };
run();
</script>
</body>
</html>
